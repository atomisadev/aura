[project]
name = "python"
version = "0.1.0"
description = ""
authors = [
    {name = "Bryan Zou", email = "bryanzzou@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "vine (>=5.1.0,<6.0.0)",
    "redis (>=4.5,<5.0)",
    "flask (>=3.1.3,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "*", from = "src" }
]

[tool.poetry.scripts]
my-project = "main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
